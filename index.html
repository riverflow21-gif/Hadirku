<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563EB">
  <title>HadirKu — Manajemen & Rekapitulasi Absensi Kelas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="app-header">
    <div class="container header-inner">
      <a href="#/" class="brand">
        <span class="brand-mark"><i data-lucide="clipboard-check"></i></span>
        <span class="brand-text">Hadir<span class="brand-accent">Ku</span></span>
      </a>
      <div class="header-right">
        <span class="today-chip" id="today-indicator"></span>
        <button class="icon-btn" id="btn-settings" title="Pengaturan Sumber Data" aria-label="Pengaturan">
          <i data-lucide="settings"></i>
        </button>
      </div>
    </div>
  </header>

  <main id="app" class="container">
    <div class="boot-loading"><span class="spinner"></span><p>Memuat data...</p></div>
  </main>

  <footer class="app-footer">
    <div class="container">
      <span><b>HadirKu</b> — Sistem Manajemen &amp; Rekapitulasi Absensi Kelas</span>
      <span class="footer-right">
        <a class="apk-link" href="apk/HadirKu.apk" download>
          <i data-lucide="download"></i> Download APK (Android)
        </a>
        <span id="mode-indicator"></span>
      </span>
    </div>
  </footer>

  <div id="modal-root"></div>
  <div id="toast-root"></div>

  <noscript><p style="text-align:center;padding:24px">Aplikasi ini membutuhkan JavaScript.</p></noscript>

  <!-- Ikon: Lucide (ganti ke js/vendor/lucide.min.js untuk mode offline/APK) -->
  <script src="https://unpkg.com/lucide@0.462.0/dist/umd/lucide.min.js"></script>

  <!-- Client Supabase (ganti ke js/vendor/supabase.js untuk mode offline/APK) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Urutan script WAJIB sesuai dependensi -->
  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/api.js"></script>
  <script src="js/components.js"></script>
  <script src="js/views/classes.js"></script>
  <script src="js/views/classDetail.js"></script>
  <script src="js/views/absensi.js"></script>
  <script src="js/views/rekap.js"></script>
  <script src="js/views/anggota.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
